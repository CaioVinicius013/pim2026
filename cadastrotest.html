<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prime Outfit | Login & Cadastro</title>
    <link rel="stylesheet" href="cadastro.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="dark-theme">
    <div class="container">
        <div class="auth-card">
            <div class="card-header">
                <button id="theme-toggle" class="theme-btn" aria-label="Alternar tema">
                    <i class="fas fa-moon"></i>
                </button>
                <h1 class="brand-logo">Prime Outfit</h1>
                <p class="subtitle">Premium Streetwear Experience</p>
            </div>

            <form id="auth-form" novalidate>
                <div class="input-group">
                    <label for="name"><i class="fas fa-user"></i> Nome Completo</label>
                    <input type="text" id="name" placeholder="Seu nome completo" required>
                    <span class="error-msg">Nome é obrigatório</span>
                </div>

                <div class="input-group">
                    <label for="email"><i class="fas fa-envelope"></i> E-mail</label>
                    <input type="email" id="email" placeholder="seu@email.com" required>
                    <span class="error-msg">E-mail inválido</span>
                </div>

                <div class="row">
                    <div class="input-group">
                        <label for="password"><i class="fas fa-lock"></i> Senha</label>
                        <input type="password" id="password" placeholder="Max 8 caracteres" maxlength="8" required>
                        <span class="error-msg">Senha obrigatória (máx 8)</span>
                    </div>
                    <div class="input-group">
                        <label for="age"><i class="fas fa-calendar-alt"></i> Idade</label>
                        <input type="number" id="age" placeholder="Ex: 25" required>
                        <span class="error-msg">Idade obrigatória</span>
                    </div>
                </div>

                <div class="input-group">
                    <label for="cpf"><i class="fas fa-id-card"></i> CPF</label>
                    <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14" required>
                    <span class="error-msg">CPF inválido</span>
                </div>

                <div class="row">
                    <div class="input-group flex-2">
                        <label for="address"><i class="fas fa-map-marker-alt"></i> Endereço</label>
                        <input type="text" id="address" placeholder="Rua, número, bairro" required>
                        <span class="error-msg">Endereço obrigatório</span>
                    </div>
                    <div class="input-group">
                        <label for="cep"><i class="fas fa-truck-fast"></i> CEP</label>
                        <input type="text" id="cep" placeholder="00000-000" maxlength="9" required>
                        <span class="error-msg">CEP inválido</span>
                    </div>
                </div>

                <button type="submit" class="submit-btn">
                    <span>Entrar / Cadastrar</span>
                    <i class="fas fa-arrow-right"></i>
                </button>
            </form>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
