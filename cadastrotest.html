<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>

    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #f4f4f4;
        }

        .container {
            background: white;
            padding: 20px;
            border-radius: 5px;
            width: 320px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            margin-bottom: 5px;
        }

        input {
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            padding: 12px;
            border: none;
            background: #007bff;
            color: white;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        .status {
            margin-top: 10px;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Cadastro</h1>

        <form id="registrationForm">

            <label for="nome">Nome completo</label>
            <input type="text" id="nome" required>

            <label for="cpf">CPF</label>
            <input
                type="text"
                id="cpf"
                placeholder="000.000.000-00"
                maxlength="14"
                required
            >

            <label for="email">E-mail</label>
            <input type="email" id="email" required>

            <label for="senha">Senha</label>
            <input type="password" id="senha" required>

            <label for="idade">Idade</label>
            <input type="number" id="idade" required>

            <label for="endereco">Endereço</label>
            <input type="text" id="endereco" required>

            <label for="cep">CEP</label>
            <input
                type="text"
                id="cep"
                placeholder="00000-000"
                required
            >

            <button type="submit">
                Cadastrar
            </button>

            <div class="status" id="status"></div>

        </form>
    </div>

    <script>
        const form = document.getElementById('registrationForm');
        const cpfInput = document.getElementById('cpf');
        const cepInput = document.getElementById('cep');
        const statusDiv = document.getElementById('status');

        // Máscara CPF
        cpfInput.addEventListener('input', (e) => {
            let value = e.target.value.replace(/\D/g, '');

            value = value.replace(/(\d{3})(\d)/, '$1.$2');
            value = value.replace(/(\d{3})(\d)/, '$1.$2');
            value = value.replace(/(\d{3})(\d{1,2})$/, '$1-$2');

            e.target.value = value;
        });

        // Máscara CEP
        cepInput.addEventListener('input', (e) => {
            let value = e.target.value.replace(/\D/g, '');

            value = value.replace(/(\d{5})(\d)/, '$1-$2');

            e.target.value = value;
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            statusDiv.innerText = 'Enviando...';

            // JSON no formato da API
            const data = {
                nmUsuario: document.getElementById('nome').value,
                email: document.getElementById('email').value,
                senha: document.getElementById('senha').value,
                idade: Number(document.getElementById('idade').value),
                cpf: document.getElementById('cpf').value.replace(/\D/g, ''),
                endereco: document.getElementById('endereco').value,
                cep: document.getElementById('cep').value
            };

            console.log('JSON enviado:', data);

            try {

                const response = await fetch(
                    'https://sublime-abdominal-pureness.ngrok-free.dev/camisagym/cadastro',
                    {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'ngrok-skip-browser-warning': 'true'
                        },
                        body: JSON.stringify(data)
                    }
                );

                const text = await response.text();

                console.log('Status HTTP:', response.status);
                console.log('Resposta API:', text);

                if (response.ok) {
                    alert('Cadastro realizado com sucesso!');
                    statusDiv.innerText = 'Cadastro realizado!';
                    form.reset();
                } else {
                    statusDiv.innerText = 'Erro na API';
                    alert('Erro da API:\n' + text);
                }

            } catch (error) {
                console.error('Erro completo:', error);
                statusDiv.innerText = 'Erro de conexão';

                alert(
                    'Erro ao conectar na API:\n\n' +
                    error.message
                );
            }
        });
    </script>

</body>
</html>
