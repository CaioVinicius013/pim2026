<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Carrinho | Prime Outfit</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

/* ================= RESET ================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Poppins', sans-serif;
  background:#0a0a0a;
  color:#fff;
}

/* ================= HEADER ================= */

.header{
  width:100%;
  padding:25px 8%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#111;
  border-bottom:1px solid rgba(255,255,255,0.08);
}

.logo{
  font-size:1.8rem;
  font-weight:700;
  color:#d4af37;
}

.back-btn{
  padding:12px 22px;
  border-radius:50px;
  border:1px solid #d4af37;
  color:#d4af37;
  text-decoration:none;
  transition:.3s;
}

.back-btn:hover{
  background:#d4af37;
  color:#000;
}

/* ================= CARRINHO ================= */

.cart-container{
  width:90%;
  max-width:1300px;
  margin:60px auto;
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:40px;
}

/* ================= PRODUTOS ================= */

.cart-products{
  display:flex;
  flex-direction:column;
  gap:25px;
}

.cart-card{
  background:#141414;
  border-radius:20px;
  overflow:hidden;
  display:flex;
  gap:20px;
  padding:20px;
  border:1px solid rgba(255,255,255,0.05);
}

.cart-card img{
  width:180px;
  height:180px;
  object-fit:cover;
  border-radius:15px;
}

.cart-info{
  flex:1;
}

.cart-info h3{
  margin-bottom:10px;
}

.price{
  color:#d4af37;
  font-weight:600;
  margin-bottom:20px;
  display:block;
}

.quantity{
  display:flex;
  align-items:center;
  gap:15px;
  margin-bottom:20px;
}

.quantity button{
  width:35px;
  height:35px;
  border-radius:50%;
  border:none;
  background:#d4af37;
  color:#000;
  font-size:1.1rem;
  font-weight:bold;
  cursor:pointer;
}

.remove-btn{
  background:transparent;
  border:none;
  color:#ff5a5a;
  cursor:pointer;
  font-size:0.95rem;
}

/* ================= RESUMO ================= */

.cart-summary{
  background:#141414;
  border-radius:20px;
  padding:30px;
  height:fit-content;
  border:1px solid rgba(255,255,255,0.05);
  position:sticky;
  top:30px;
}

.cart-summary h2{
  margin-bottom:30px;
}

.summary-item{
  display:flex;
  justify-content:space-between;
  margin-bottom:20px;
  color:#ccc;
}

.total{
  font-size:1.4rem;
  color:#fff;
  font-weight:700;
  margin:30px 0;
  display:flex;
  justify-content:space-between;
}

.checkout-btn{
  width:100%;
  padding:18px;
  border:none;
  border-radius:14px;
  background:#d4af37;
  color:#000;
  font-weight:700;
  font-size:1rem;
  cursor:pointer;
  transition:.3s;
}

.checkout-btn:hover{
  transform:translateY(-4px);
  box-shadow:0 10px 20px rgba(212,175,55,0.3);
}

/* ================= RESPONSIVO ================= */

@media(max-width:900px){

  .cart-container{
    grid-template-columns:1fr;
  }

}

@media(max-width:700px){

  .cart-card{
    flex-direction:column;
  }

  .cart-card img{
    width:100%;
    height:280px;
  }

}

</style>
</head>

<body>

<!-- ================= HEADER ================= -->

<header class="header">

  <div class="logo">
    Prime Outfit
  </div>

  <a href="index.html" class="back-btn">
    ← Voltar à Loja
  </a>

</header>

<!-- ================= CARRINHO ================= -->

<section class="cart-container">

  <!-- PRODUTOS -->
  <div class="cart-products">

    <!-- PRODUTO 1 -->
    <div class="cart-card">

      <img src="https://images.unsplash.com/photo-1527719327859-c6ce80353573?q=80&w=1200&auto=format&fit=crop">

      <div class="cart-info">

        <h3>Camiseta Essential Black</h3>

        <span class="price" data-price="149.90">
          R$ 149,90
        </span>

        <div class="quantity">

          <button class="minus">-</button>

          <span class="qty">1</span>

          <button class="plus">+</button>

        </div>

        <button class="remove-btn">
          Remover produto
        </button>

      </div>

    </div>

    <!-- PRODUTO 2 -->
    <div class="cart-card">

      <img src="https://images.unsplash.com/photo-1516826957135-700dedea698c?q=80&w=1200&auto=format&fit=crop">

      <div class="cart-info">

        <h3>Moletom Urban Gray</h3>

        <span class="price" data-price="249.90">
          R$ 249,90
        </span>

        <div class="quantity">

          <button class="minus">-</button>

          <span class="qty">1</span>

          <button class="plus">+</button>

        </div>

        <button class="remove-btn">
          Remover produto
        </button>

      </div>

    </div>

  </div>

  <!-- RESUMO -->
  <div class="cart-summary">

    <h2>Resumo do Pedido</h2>

    <div class="summary-item">
      <span>Produtos</span>
      <span id="subtotal">R$ 399,80</span>
    </div>

    <div class="summary-item">
      <span>Entrega</span>
      <span>Grátis</span>
    </div>

    <div class="total">
      <span>Total</span>
      <span id="total">R$ 399,80</span>
    </div>

    <button class="checkout-btn">
      Finalizar Compra
    </button>

  </div>

</section>

<!-- ================= SCRIPT ================= -->

<script>

const plusBtns = document.querySelectorAll('.plus');
const minusBtns = document.querySelectorAll('.minus');
const removeBtns = document.querySelectorAll('.remove-btn');

function updateTotal(){

  let total = 0;

  document.querySelectorAll('.cart-card').forEach(card => {

    const price = parseFloat(
      card.querySelector('.price').dataset.price
    );

    const qty = parseInt(
      card.querySelector('.qty').textContent
    );

    total += price * qty;

  });

  document.getElementById('subtotal').textContent =
    `R$ ${total.toFixed(2).replace('.', ',')}`;

  document.getElementById('total').textContent =
    `R$ ${total.toFixed(2).replace('.', ',')}`;
}

plusBtns.forEach(btn => {

  btn.addEventListener('click', () => {

    const qtyElement =
      btn.parentElement.querySelector('.qty');

    let qty = parseInt(qtyElement.textContent);

    qty++;

    qtyElement.textContent = qty;

    updateTotal();

  });

});

minusBtns.forEach(btn => {

  btn.addEventListener('click', () => {

    const qtyElement =
      btn.parentElement.querySelector('.qty');

    let qty = parseInt(qtyElement.textContent);

    if(qty > 1){

      qty--;

      qtyElement.textContent = qty;

      updateTotal();

    }

  });

});

removeBtns.forEach(btn => {

  btn.addEventListener('click', () => {

    btn.closest('.cart-card').remove();

    updateTotal();

  });

});

updateTotal();

</script>

</body>
</html>
