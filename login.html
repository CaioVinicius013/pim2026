<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Prime Outfit</title>
    <link rel="stylesheet" href="login.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <button class="theme-toggle" id="themeToggle" title="Alternar tema">
        <i class="fas fa-moon"></i>
    </button>

    <div class="login-container">
        <div class="login-card">
            <div class="card-header">
                <div class="logo">
                    <span class="brand-name">PRIME</span>
                    <span class="brand-suffix">OUTFIT</span>
                </div>
                <p class="subtitle">Bem-vindo de volta!</p>
            </div>

            <form id="loginForm" novalidate>
                <div class="input-group" id="emailGroup">
                    <label for="email">E-mail</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" id="email" name="email" placeholder="seu@email.com" required>
                    </div>
                    <span class="error-message">E-mail inválido</span>
                </div>

                <div class="input-group" id="passwordGroup">
                    <label for="password">Senha</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="senha" name="senha" placeholder="••••••••" required maxlength="20">
                        <button type="button" class="toggle-password" id="togglePassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <span class="error-message">A senha deve ter no máximo 8 caracteres</span>
                </div>

                <div class="form-options">
                    <label class="checkbox-container">
                        <input type="checkbox" id="rememberMe">
                        <span class="checkmark"></span>
                        Lembrar-me
                    </label>
                    <a href="#" class="forgot-password">Esqueci minha senha</a>
                </div>

                <button type="submit" class="login-button" id="loginButton">
                    <span class="button-text">Entrar</span>
                    <div class="loader"></div>
                </button>

                <div class="api-feedback" id="apiFeedback"></div>

                <div class="signup-prompt">
                    Não tem uma conta? <a href="prime-outfit.html">Cadastrar-se</a>
                </div>
            </form>
        </div>
    </div>

    
    <script src="login.js"></script>
</body>
</html>
